<style>
:root{--ink:#111;--paper:#fbfaf5;--soft:#ecebe4;--mid:#6b6b6b;--r:255px 14px 225px 14px/14px 225px 14px 255px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Patrick Hand",cursive;min-height:100vh;
  background-image:linear-gradient(#0000 31px,#0000000d 32px);background-size:100% 32px}
#app{max-width:900px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:1px}
p{line-height:1.45}
.muted{color:var(--mid)}
.small{font-size:14px}
.btn{font:inherit;font-size:17px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--r);
  padding:10px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.center{text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.right:disabled,.btn.wrong:disabled{opacity:1}
.btn.right{background:var(--ink);color:#fff}
.btn.wrong{background:repeating-linear-gradient(45deg,#fff 0 6px,#ccc 6px 9px);text-decoration:line-through}
.btn.gone{visibility:hidden}
.box{border:2.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:14px 16px;box-shadow:4px 4px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.emo{filter:grayscale(1) contrast(1.3)}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;background:#fff}
.tag.dark{background:var(--ink);color:#fff}

textarea{min-height:110px;resize:vertical}
[data-s] .card{width:200px}
.card{position:relative;border:2.5px solid var(--ink);border-radius:12px 6px 14px 5px;background:#fff;padding:6px 8px 8px;width:150px;box-shadow:3px 3px 0 var(--ink);cursor:default}
.card.sel{outline:3px dashed var(--ink);outline-offset:3px}
.card.click{cursor:pointer}
.card.fainted{opacity:.5}
.card .nm{font-size:14px;font-weight:bold;display:flex;justify-content:space-between;gap:4px}
.card svg{display:block;margin:0 auto}
.card .fl{font-size:12px;color:var(--mid);min-height:30px}
.hp{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--ink);transition:width .5s}
.hp.big{height:14px}
.hptxt{font-size:12px;text-align:right}
.arena{position:relative;border:2.5px solid var(--ink);border-radius:var(--r);background:#fff;min-height:270px;padding:12px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.arena .foe{position:absolute;right:16px;top:8px;text-align:right}
.arena .me{position:absolute;left:16px;bottom:6px}
.plate{background:#fff;border:2px solid var(--ink);border-radius:8px 3px 10px 3px;padding:4px 8px;width:200px;font-size:14px}
.arena .foe .plate{position:absolute;right:150px;top:6px}
.arena .me .plate{position:absolute;left:150px;bottom:20px}
.ground{position:absolute;border:2px solid var(--ink);border-radius:50%;height:22px;background:repeating-linear-gradient(90deg,#fff 0 4px,#e6e6e6 4px 6px)}
.mon{overflow:visible}
.mon.flip{transform:scaleX(-1)}
.shake{animation:shake .45s}
.lunge{animation:lunge .4s}
.lungeL{animation:lungeL .4s}
.faint{animation:faint .7s forwards}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
@keyframes lunge{50%{transform:translate(40px,-20px)}}
@keyframes lungeL{50%{transform:translate(-40px,20px)}}
@keyframes faint{to{transform:translateY(30px) rotate(12deg);opacity:.25}}
.pop{position:absolute;font-size:26px;font-weight:bold;pointer-events:none;animation:pop 1.1s forwards;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-50px)}}
.qbox{margin-top:16px}
.q{font-size:19px;margin:6px 0 12px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.arena{min-height:250px}.plate{width:150px}.arena .foe .plate{right:112px}.arena .me .plate{left:112px}}
.opts .btn .k{display:inline-block;min-width:22px;font-weight:bold}
.fb{margin-top:12px;padding:10px 12px;border:2px dashed var(--ink);border-radius:10px;background:#fff}
table.data{border-collapse:collapse;margin:6px 0 10px;background:#fff;font-size:15px}

.teambar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:stretch}
.teambar .card{width:132px;padding:4px 6px 6px}
.teambar .card .fl{display:none}
.bag{display:flex;gap:8px;flex-wrap:wrap}
.item{border:2px solid var(--ink);border-radius:10px 4px 10px 4px;background:#fff;padding:6px 10px;font:inherit;font-size:15px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item small{display:block;font-size:12px;color:var(--mid);max-width:190px;text-align:left}
.map{display:flex;align-items:center;gap:0;margin:18px 0;flex-wrap:wrap}
.node{width:62px;height:62px;border:2.5px solid var(--ink);border-radius:50% 45% 52% 48%;display:grid;place-items:center;background:#fff;font-size:24px}
.node.done{background:var(--ink);color:#fff}
.node.cur{outline:3px dashed var(--ink);outline-offset:4px}
.link{width:40px;border-top:3px dashed var(--ink)}
.typeicon{font-family:"Segoe UI Symbol","Apple Symbols",sans-serif}
.share{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.banner{border:3px double var(--ink);padding:10px 14px;border-radius:12px;background:#fff;margin:10px 0}
.rub li{margin:3px 0}
.chartwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.hof .entry{border-top:2px dashed var(--ink);padding:10px 0}
.minis{display:flex;gap:4px;align-items:flex-end}
.minis div{text-align:center;font-size:11px}
a{color:var(--ink)}
.typechart{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mid);margin-top:6px}
</style>

<script>
"use strict";
document.getElementById("nojs").remove(); // shown only where scripts cannot run (e.g. iPhone file preview)
/* ============================================================
   COMPÉMON — Compensation Exam 2 (Chapters 7–11)
   Paste your hosted link here once you host the file (e.g. Netlify Drop).
   It goes into the share text so friends can tap it.
   ============================================================ */
const SHARE_URL = "https://computergenx.github.io/compemon/";

/* ---------- storage (safe) ---------- */
const KEY = "compemon.v1.";
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- seeded RNG ---------- */
function xmur(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^ h >>> 16) >>> 0; }
function rngFor(seed, stream) { let a = xmur(seed + "|" + stream); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newSeed() { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }

/* ---------- chapter types ---------- */
const TYPES = {
  7: { icon: "◆", name: "Market", ch: "Ch 7 External Competitiveness" },
  8: { icon: "▲", name: "Survey", ch: "Ch 8 Surveys & Structures" },
  9: { icon: "●", name: "Motive", ch: "Ch 9 Pay for Performance" },
  10: { icon: "■", name: "Incentive", ch: "Ch 10 P4P Plans" },
  11: { icon: "★", name: "Appraisal", ch: "Ch 11 Performance Appraisal" }
};

/* ---------- data tables from the slides ---------- */
const T_MIX = [["Employer", "Base", "Variable", "Benefits", "Total"], ["A", "$65,000", "$5,000", "$20,000", "$90,000"], ["B", "$55,000", "$20,000", "$15,000", "$90,000"]];
const T_GRID10 = [["Rating", "CR 80–90%", "CR 91–110%", "CR 111–120%"], ["Exceeds", "7%", "5%", "3%"], ["Meets", "4%", "3%", "2%"], ["Below", "2%", "0%", "0%"]];
const T_GRID11 = [["Rating", "CR < 0.90", "CR 0.90–1.10", "CR > 1.10"], ["Exceeds", "6%", "5%", "4%"], ["Meets", "4%", "3%", "2%"], ["Below", "0%", "0%", "0%"]];
const T_SURVEY = [["Short-term plan", "% of orgs"], ["Annual incentive plan", "89%"], ["Spot cash awards", "50%"], ["Discretionary bonus", "34%"], ["Retention bonus", "32%"], ["Project bonus", "16%"], ["Profit sharing", "14%"], ["Team incentives", "12%"], ["Gainsharing", "4%"]];
const T_REG = [["Market pay line (regression on benchmark jobs)"], ["Market pay = $20,000 + $100 × job-evaluation points"], ["R² = 0.92"]];
const T_RANGE = [["Grade 2", "Pay"], ["Maximum", "$65,875"], ["Midpoint", "$54,986"], ["Minimum", "$43,917"]];

/* ---------- question bank ----------
   M(chapter, difficulty 1-3, question, [correct, wrong...], explanation, table?)
   T(chapter, difficulty, statement, true/false, explanation)            */
const BANK = [];
function M(c, d, q, a, e, tbl) { BANK.push({ id: BANK.length, kind: "mc", c, d, q, a, e, tbl }); }
function T(c, d, q, tf, e) { BANK.push({ id: BANK.length, kind: "tf", c, d, q, tf, e }); }

/* Chapter 7 */
M(7,1,"External competitiveness refers to:",["Pay relationships across organizations — how our pay compares with competitors","Pay relationships among jobs inside one organization","The share of pay that is variable","Legal compliance of pay practices"],"External = across organizations. Internal alignment is about jobs within one organization.");
M(7,1,"Pay level is best defined as:",["The average pay an employer offers relative to competing employers","The combination of base pay, incentives, and benefits","The gap between the highest- and lowest-paid job","The legal minimum wage in the market"],"Pay level = average amount paid relative to competitors. The combination of forms is pay mix.");
M(7,1,"Pay mix is:",["The combination of base pay, incentives, benefits, and other rewards","The average amount paid relative to competitors","The number of pay grades in a structure","Salary divided by range midpoint"],"Pay mix = the forms of pay. Two firms with the same total can have very different mixes.");
M(7,1,"The two objectives of external competitiveness decisions are to:",["Control labor costs and attract & retain employees","Ensure internal equity and legal compliance","Maximize benefits and minimize turnover","Set merit budgets and appraise performance"],"Slide: Control labor costs (pay level × number of employees) and attract & retain employees.");
M(7,2,"Using the table, which statement is TRUE?",["Total pay is equal, but B's mix may attract more risk-tolerant, performance-driven people","A has a higher pay level than B","B lags the market and A leads it","Because totals match, both will attract the same employees"],"Same $90,000 total, different mix. B puts more pay at risk ($20k variable), which sorts in performance-driven people.",T_MIX);
M(7,2,"Marginal REVENUE of labor is:",["The revenue generated by the extra output of one more employee","The extra output produced by one more employee","Total revenue divided by headcount","The wage needed to attract one more employee"],"Marginal product = extra output. Marginal revenue = the revenue from that extra output.");
M(7,2,"Marginal PRODUCT of labor is:",["The additional output from one more employee","The revenue from one more employee's output","The average output per employee","The cost of one more employee"],"Marginal product is output; marginal revenue converts it to dollars.");
M(7,2,"An employer should keep adding employees as long as:",["Marginal revenue of the next hire is greater than that hire's cost","Marginal product is positive","Average pay is below the market","Turnover is above the industry average"],"Hire when MR of labor > employment cost.");
M(7,2,"Efficiency wage theory says paying ABOVE market can:",["Attract stronger applicants, reduce turnover, and increase effort","Always lower total labor costs","Guarantee higher profit regardless of productivity","Remove the need for pay surveys"],"Efficiency wages: higher pay → better applicants, less turnover, more effort (a demand-side effect).");
M(7,2,"Under sorting & signaling, a pay package heavy on incentives mainly:",["Signals the employer values performance and influences who joins or stays","Shows the product market is uncompetitive","Pushes wages below applicants' reservation wage","Means the firm uses broadbanding"],"The package sends a signal; applicants self-select (sort) based on it.");
M(7,1,"A reservation wage is:",["The lowest wage an applicant will accept","The wage held back for top performers","The midpoint of a pay range","The legally required minimum wage"],"Supply side: each applicant's personal minimum acceptable wage.");
M(7,2,"Human capital theory predicts that:",["Education, training, and experience raise productivity and therefore earnings","Pay depends only on product demand","Risky jobs must pay more","Higher pay always increases effort"],"Supply side: investments in human capital raise productivity and earnings.");
M(7,2,"Compensating differentials explain why:",["Unpleasant or risky jobs must pay more to attract workers","High performers receive bonuses","Large firms pay more than small firms","Product competitors pay similar wages"],"Workers need extra pay to accept unpleasant or risky job attributes.");
M(7,3,"Intense competition in a firm's PRODUCT market tends to:",["Limit its ability to pass higher labor costs on to customers","Let it lead the labor market freely","Raise applicants' reservation wages","Make pay surveys unnecessary"],"Product market sets what the firm can recover. Strong price competition caps labor costs.");
M(7,2,"Which is an ORGANIZATION factor that shapes pay level?",["Industry, size, technology, and business strategy","Customer demand for the product","Applicants' reservation wages","The marginal product of labor"],"Organization factors: strategy, industry, size, technology, employee preferences.");
M(7,3,"A grocery chain is hiring software engineers. Its relevant LABOR market is:",["Employers that compete for software engineers, even in other industries","Other grocery chains only","Every employer in its city, for every job","Firms that sell to the same customers"],"Labor competitors can differ from product competitors. Define by occupation, geography, and competitors for the same skills.");
M(7,2,"The three things to consider when defining the relevant labor market are:",["Occupation, geography, and competitors","Pay level, pay mix, and benefits","Expectancy, instrumentality, and valence","Base, total cash, and total compensation"],"Slide 7: occupation, geography, competitors (product vs labor).");
M(7,1,"Which pay-level policy sets pay ABOVE the market?",["Lead","Match","Lag","Broadband"],"Lead = above, match = near, lag = below market.");
M(7,2,"The main risk of a LAG policy is:",["Hiring and retention may suffer","Higher costs that must earn a return","No advantage at all on pay","Legal noncompliance"],"Lag lowers current cash cost but can hurt attraction and retention.");
M(7,2,"The main risk of a LEAD policy is:",["Higher costs that must be recovered through productivity, quality, or another return","Difficulty attracting applicants","Little advantage on pay alone","Lower applicant quality"],"Lead supports attraction and retention, but higher costs require a return.");
M(7,2,"The main risk of a MATCH policy is:",["Little competitive advantage on pay alone","Very high labor costs","Severe hiring problems","Illegal pay discrimination"],"Match gives comparable costs and hiring access but no pay edge.");
M(7,3,"A firm matches the market on base pay but leads on incentives. This shows that:",["Pay-level policy can differ by form of pay (and by job or unit)","The firm is lagging overall","It violates external competitiveness","Pay mix does not matter"],"Slide 8: a firm might lead on incentives while matching base pay.");
M(7,2,"A firm emphasizes flexible schedules, generous leave, and wellness benefits. Its pay mix stresses:",["Work–life balance","Performance driven","Security","Shared choice"],"Pay mix options: performance driven, work-life balance, security, shared choice.");
M(7,2,"Employees pick among reward options within limits. This pay-mix approach is:",["Shared choice","Security","Performance driven","Lag policy"],"Shared choice = employees select within limits.");
M(7,3,"Stable base pay and predictable benefits with little variable pay describes which pay mix?",["Security","Performance driven","Shared choice","Lead"],"Security = stable pay and predictable benefits.");
T(7,1,"Two employers can offer the same total compensation and still attract different employees because of pay mix.",true,"Yes — the $90,000 A vs B example.");
T(7,2,"Product-market competitors and labor-market competitors are always the same organizations.",false,"They can differ — e.g., tech firms compete with a grocery chain for software engineers.");
T(7,1,"A lag policy lowers current cash costs but may hurt hiring and retention.",true,"That is the lag trade-off.");
T(7,2,"Paying above market always guarantees higher productivity.",false,"Higher pay needs a return; it is not guaranteed.");
T(7,2,"A company can use different pay-level policies for different occupations or forms of pay.",true,"Slide 8: policies can vary by occupation, unit, or form of pay.");
T(7,2,"Efficiency wage theory is a supply-side explanation of pay.",false,"Efficiency wages and sorting/signaling are DEMAND-side. Reservation wage and human capital are supply-side.");

/* Chapter 8 */
M(8,1,"Which is NOT a main purpose of a pay survey?",["Rating individual employees' performance","Setting the pay level","Evaluating the pay mix","Building or validating the pay structure"],"Survey purposes: pay level, pay mix, structure, specific problems, competitors' labor costs.");
M(8,1,"Benchmark jobs are:",["Jobs with recognizable, comparable content that anchor market comparisons","The highest-paid jobs in the company","Jobs unique to one employer","Jobs filled by the newest employees"],"Benchmarks are stable, well-known jobs you can match across firms.");
M(8,2,"When matching your jobs to survey jobs you should:",["Compare actual job content, not just titles","Match by job title only","Only use jobs that exist in every industry","Pick whichever survey job pays the most"],"Titles alone are not enough — compare content and use judgment.");
M(8,2,"Total CASH compensation includes:",["Base pay plus bonuses and other cash incentives","Base pay only","Base pay, incentives, and benefits","Benefits only"],"Base → total cash (adds bonuses) → total compensation (adds benefits).");
M(8,2,"Which pay measure is broadest but makes comparisons most complex?",["Total compensation","Base pay","Total cash","Merit increase"],"Total compensation adds benefits and other rewards.");
M(8,2,"Base pay data is best for:",["Comparing the market value of similar work","Seeing the effect of bonuses","Comparing benefit costs","Measuring individual performance"],"Slide 3: base pay is best for comparing market value of similar work.");
M(8,2,"As a job becomes more specialized or senior, its relevant geographic market usually:",["Expands (regional, national, or global)","Shrinks to the local area","Stays exactly the same","Stops mattering"],"Senior/specialized talent is recruited from farther away.");
M(8,2,"A 'fuzzy' market describes:",["New or hybrid jobs that do not map cleanly onto one occupation or industry","A market with unreliable survey vendors","A market where every employer pays the same","A market where pay is set by law"],"Fuzzy markets: hybrid skills that don't fit one comparison group.");
M(8,3,"A MARKET PAY LINE is:",["A regression line linking internal job value (e.g., JE points) to market pay for benchmark jobs","The line after adjusting the market for a lead/lag policy","A line connecting range minimums","A line connecting the highest-paid employees"],"Market pay line = regression of market rates on job evaluation results. The policy line adjusts it.");
M(8,3,"Using the regression, what is the predicted market pay for a 400-point job?",["$60,000","$40,000","$20,400","$80,000"],"$20,000 + $100 × 400 = $60,000.",T_REG);
M(8,3,"Using the regression, the firm LEADS the market by 10%. What is the pay policy line value at 400 points?",["$66,000","$60,000","$70,000","$54,000"],"Market = $60,000. Lead 10% → $60,000 × 1.10 = $66,000.",T_REG);
M(8,3,"Using the regression, the firm LAGS the market by 5%. Pay policy for a 300-point job is:",["$47,500","$50,000","$52,500","$45,000"],"Market = $20,000 + $30,000 = $50,000. Lag 5% → $47,500.",T_REG);
M(8,3,"What does the R² of 0.92 in this regression tell you?",["Job evaluation points explain most of the variation in market pay","92% of jobs are paid above market","The firm pays 92% of the market","Only 8% of jobs are benchmarks"],"R² = share of variance in market pay explained by JE points. 0.92 = a strong fit.",T_REG);
M(8,3,"The PAY POLICY LINE differs from the market pay line because it:",["Adjusts the market line to reflect the firm's lead, match, or lag policy","Uses only non-benchmark jobs","Shows the minimum of each pay range","Ignores market data"],"Policy line = market line + the firm's competitive policy.");
M(8,2,"In a pay survey, the 50th percentile is:",["The median — half of the reported rates fall below it","The average of the highest and lowest rate","The most common rate","The top half's average"],"50th percentile = median. A 'match' policy often targets it.");
M(8,1,"A pay GRADE groups:",["Different jobs treated as substantially equal for pay purposes","Employees by performance rating","Employees by seniority","Only identical jobs"],"Jobs in a grade share the same pay range.");
M(8,1,"A pay RANGE sets:",["A minimum, midpoint, and maximum for jobs in a grade","One flat rate for each job","The market's 50th percentile","The size of each bonus"],"Ranges allow pay differences for experience and performance.");
M(8,2,"Range spread is calculated as:",["(Maximum ÷ Minimum) − 1","Maximum − Minimum","Maximum ÷ Midpoint","(Maximum + Minimum) ÷ 2"],"Slide formula: (Max ÷ Min) − 1. (Max + Min) ÷ 2 is a midpoint.");
M(8,3,"Using the Grade 2 range, the range spread is about:",["50%","22%","33%","150%"],"$65,875 ÷ $43,917 = 1.50 → 1.50 − 1 = 50%.",T_RANGE);
M(8,2,"Pay ranges allow different pay within one grade mainly for:",["Experience and performance","Job title","Department name","Office location only"],"Slide: ranges recognize differences in experience and performance.");
M(8,2,"Compared with traditional grades, BROADBANDING uses:",["Fewer, wider bands that support lateral and cross-functional moves","More grades with narrower ranges","Tighter midpoint controls","No managerial discretion"],"Broadbanding = fewer, wider bands; flexibility within guidelines.");
M(8,3,"The main risk of broadbanding is:",["Inconsistency and favoritism from greater managerial discretion","Rigidity and limited flexibility","Too few lateral moves","Too many midpoint controls"],"Broad bands → discretion → risk of inconsistency/favoritism. Rigidity is the traditional grades' risk.");
M(8,3,"The main risk of traditional grades and ranges is:",["Rigidity and limited flexibility","Inconsistency and favoritism","Too much managerial discretion","No promotion steps"],"Traditional: structured progression and controls, but rigid.");
M(8,2,"Traditional grades and ranges fit best when the organization needs:",["Structured progression and built-in cost controls","Maximum lateral movement","Wide managerial discretion","No pay structure at all"],"'Flexibility within controls.'");

function makeChartSA(r) {
  const mid = [50000, 56000, 60000, 64000, 70000, 80000][Math.floor(r() * 6)];
  const crT = [[0.84, 0.86, 0.88], [0.94, 0.97, 1.0, 1.04], [1.13, 1.15, 1.17]][Math.floor(r() * 3)];
  const target = crT[Math.floor(r() * crT.length)];

}

      qs = shuffle(qs, rq).sort((a, b) => a.d - b.d).map(q => prepQ(q, rq));

function parseCode(s) {
  const m = /([QT])-([A-Z0-9]{6})(?:-(\d{1,3}))?(?:-([^#&\s]+))?/i.exec(s || "");
  if (!m) return null;
  let name = ""; try { name = m[4] ? decodeURIComponent(m[4]) : ""; } catch (e) { name = m[4] || ""; }
  return { mode: m[1].toUpperCase() === "Q" ? "quiz" : "test", seed: m[2].toUpperCase(), pct: m[3] != null ? +m[3] : null, name };
}

  }
  return `<textarea id="sa_t" ${B.answered ? "disabled" : ""} placeholder="Write 3–6 sentences. Use the key terms from the slides.">${esc((B.saAns || {}).t || "")}</textarea>
  ${B.answered ? "" : `<div class="hint">Graded 0–10 by a keyword rubric. Name the concepts and define them.</div><button class="btn dark center" id="saSub" style="margin-top:10px">Submit answer ✍️</button>`}`;
}
function answerMC(i) {
  if (B.answered) return; const q = curQ(); B.answered = true; B.pick = i;
  const ok = i === q.ans;
  resolveHit(ok ? 1 : 0, q);
  B.res = `<div class="fb"><b>${ok ? "✔ Correct!" : "✘ Not quite."}</b> ${ok ? "" : "Answer: <b>" + esc(q.opts[q.ans]) + "</b>. "}${esc(q.e)}<div style="margin-top:10px"><button class="btn dark center" id="next">Continue ↵</button></div></div>`;
  battleScreen();
}
function submitSA() {
  const q = curQ(); let g;
  if (q.sub === "chart") { B.saAns = { a: val("sa_a"), b: val("sa_b"), c: val("sa_c"), d: val("sa_d") }; g = gradeChart(q, B.saAns); }
  else { B.saAns = { t: val("sa_t") }; g = gradeConcept(q, B.saAns.t); }
  B.answered = true;
  resolveHit(g.score / 10, q, g.score);
  B.res = `<div class="fb"><b>Graded ${g.score}/10</b> — ${B.solo ? "" : g.score >= 9 ? "devastating hit!" : g.score >= 7 ? "solid hit!" : g.score >= 4 ? "glancing blow." : "barely a scratch."}
    <ul class="rub">${g.items.map(it => `<li>${it.ok >= it.p && it.p ? "✔" : it.ok > 0 ? "◐" : "✘"} ${esc(it.l)} ${it.p ? `<span class="muted">(${it.ok}/${it.p})</span>` : ""}</li>`).join("")}</ul>
    <div class="small"><b>Model answer:</b> ${esc(q.sub === "chart" ? q.e : q.model)}</div>
    <div style="margin-top:10px"><button class="btn dark center" id="next">Continue ↵</button></div></div>`;
  battleScreen();
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

function resolveHit(frac, q, saScore) {
  S.log.push({ z: S.zi, kind: q.kind, c: q.c, ok: frac === 1, frac, sa: saScore, q: q.q, right: q.kind === "sa" ? q.e : q.opts[q.ans], e: q.e, pick: q.kind === "sa" ? null : q.opts[B.pick] });
  const a = active(), msgs = [];
  if (a && frac >= 0.5) { a.xp++; if (a.xp >= 3) { a.xp -= 3; levelUp(a); msgs.push(`${SP[a.sp].name} grew to Lv${a.lvl}!`); } }
  if (B.solo) { B.msg = msgs.join(" "); return; }
  const f = foe(), fname = SP[f.sp].name, aname = SP[a.sp].name;
  if (B.turn === "atk") {
    if (frac > 0) {
      const typeM = SP[a.sp].c === q.c ? 1.5 : 1, lvlM = 1 + 0.06 * (a.lvl - 3), spot = S.flags.spot ? 2 : 1;
      const dmg = HIT * frac * (q.kind === "sa" ? 2 : 1) * typeM * lvlM * spot;
      S.flags.spot = 0;
      f.hp = Math.max(0, f.hp - dmg);
      msgs.unshift(`${aname} hits ${fname} for ${Math.round(dmg)}!${typeM > 1 ? " Super effective!" : ""}${spot > 1 ? " Spot Award doubled it!" : ""}`);
      B.anim = { me: "lunge", foe: "shake", pop: "-" + Math.round(dmg), at: "foe" };
      if (f.hp <= 0) {
        S.kos++; msgs.push(`${fname} fainted!`);
        B.fi++;
        if (B.fi >= B.foes.length) { B.fi--; B.won = true; }
        else msgs.push(`The boss team sends out ${SP[foe().sp].name}!`);
      }
    } else msgs.unshift(`${aname}'s attack missed!`);
  } else {
    if (frac === 1) { msgs.unshift(`${aname} blocked ${fname}'s attack!`); B.anim = { foe: "lungeL", pop: "BLOCK", at: "me" }; }
    else if (S.flags.shield) { S.flags.shield = 0; msgs.unshift(`Retention Bonus blocked ${fname}'s attack!`); B.anim = { foe: "lungeL", pop: "🛡️", at: "me" }; }
    else {
      const resist = SP[a.sp].c === q.c ? 0.6 : 1;
      const dmg = B.Z.dmg * (B.boss ? 1.25 : 1) * resist * (1 - frac);
      a.hp = Math.max(0, a.hp - dmg);
      msgs.unshift(`${fname} hits ${aname} for ${Math.round(dmg)}!${resist < 1 ? " (resisted)" : ""}`);
      B.anim = { me: "shake", foe: "lungeL", pop: "-" + Math.round(dmg), at: "me" };
      if (a.hp <= 0) faint(msgs);
    }
  }
  B.msg = msgs.join(" ");
}
function faint(msgs) {
  const a = active();
  msgs.push(`${SP[a.sp].name} fainted and leaves your team for good. 🪦`);
  S.fallen.push({ sp: a.sp, lvl: a.lvl });
  S.team.splice(S.active, 1); S.active = 0;
  if (S.team.length) msgs.push(`Go, ${SP[S.team[0].sp].name}!`);
  else { B.wiped = true; msgs.push(S.mode === "quiz" ? "Your whole team is gone. Run over!" : "Your whole team is gone… finish the exam solo!"); }
}
function playAnim(an) {
  const me = document.getElementById("meS"), fo = document.getElementById("foeS"), ar = document.getElementById("arena");
  if (me && an.me) me.classList.add(an.me);
  if (fo && an.foe) fo.classList.add(an.foe);
  if (ar && an.pop) { const p = document.createElement("div"); p.className = "pop"; p.textContent = an.pop; if (an.at === "foe") { p.style.right = "70px"; p.style.top = "40px"; } else { p.style.left = "80px"; p.style.bottom = "100px"; } ar.appendChild(p); }
}
function nextQ() {
  const wasSolo = B.solo;
  B.answered = false; B.res = null; B.elim = []; B.peer = null; B.saAns = null; B.pick = null;
  if (wasSolo) {
    if (soloDraw(B.lap)) { B.msg = ""; return battleScreen(); }
    if (B.lap) { B = null; S.zi++; return S.zi >= S.zones.length ? results() : mapScreen(); }
    return results();
  }
  if (B.wiped) { if (S.mode === "quiz") { S.over = true; return results(); } return startSolo(); }
  if (B.won) return reward();
  const Z = B.Z;
  if (S.mode === "test") {
    if (zRemaining(Z) === 0) { B.end = B.boss ? "timeBoss" : "flee"; return reward(); }
    if (!B.boss && zRemaining(Z) <= Z.reserve) { B.end = "flee"; return reward(); }
  }
  B.turn = B.turn === "atk" ? "def" : "atk";
  drawQ();
  B.msg = B.turn === "atk" ? "Your turn to attack!" : `${SP[foe().sp].name} is winding up an attack — block it!`;
  battleScreen();
}
function startSolo() {
  B = { solo: true, answered: false, elim: [], msg: "" };
  if (!soloDraw(false)) return results();
  battleScreen();
}

/* ---------- rewards ---------- */
function itemOffers(n) {
  const Z = S.zones[S.zi];
  const r = rngFor(S.seed, "items-" + S.zi + "-" + Z.done);
  const pool = Object.keys(ITEMS).filter(k => !(S.mode === "test" && ITEMS[k].assist));
  return shuffle(pool, r).slice(0, n);
}
function reward() {
  const lead = SP[B.foes[0].sp], bossSp = SP[B.foes[B.foes.length - 1].sp];
  let html = "";
  if (B.won && B.boss) {
    S.badges++; S.team.forEach(m => m.hp = Math.max(m.hp, Math.round(m.max * 0.5)));
    html = `<h2>🏅 You beat the boss team!</h2><p>${esc(bossSp.name)} and crew are down. Badge earned. Your team rests to at least half HP. Pick one item:</p>
    <div class="bag">${itemOffers(3).map(k => `<button class="item" data-take="${k}"><span class="emo">${ITEMS[k].i}</span> ${ITEMS[k].n}<small>${ITEMS[k].d}</small></button>`).join("")}</div>`;
  } else if (B.won) {
    const full = S.team.length >= 4, sp = B.foes[0].sp;
    html = `<h2>${esc(lead.name)} is knocked out!</h2>
    <div class="row" style="align-items:flex-start">${card(mkMon(sp, B.Z.lvl), { fl: 1, size: 120 })}
    <div style="flex:1;min-width:240px"><p><b>Choose ONE reward:</b></p>
    ${full ? `<p class="small">Your team is full (4). Tap a teammate to swap out, or take an item.</p><div class="teambar">${S.team.map((m, i) => card(m, { click: 1, i })).join("")}</div>` : `<button class="btn dark" id="catch">Catch ${esc(lead.name)}! (joins at Lv${B.Z.lvl})</button>`}
    <p class="small" style="margin-top:12px">…or take an item:</p>
    <div class="bag">${itemOffers(2).map(k => `<button class="item" data-take="${k}"><span class="emo">${ITEMS[k].i}</span> ${ITEMS[k].n}<small>${ITEMS[k].d}</small></button>`).join("")}</div></div></div>`;
  } else if (B.end === "timeBoss") {
    html = `<h2>⏰ Time's up for this section!</h2><p>The exam questions for this zone ran out, so the boss team retreats. No badge this time.</p><button class="btn dark center" id="cont">Continue</button>`;
  } else {
    html = `<h2>${esc(lead.name)} ran off!</h2><p>${S.mode === "test" ? "The boss team is closing in — this section's last questions belong to them." : "Keep going!"}</p><button class="btn dark center" id="cont">Continue</button>`;
  }
  app.innerHTML = `<div class="box">${html}</div>`;
  const wasBossWin = B.won && B.boss;
  const done = () => wasBossWin && S.mode === "test" && zRemaining(S.zones[S.zi]) > 0 ? startLap() : advance();
  app.querySelectorAll("[data-take]").forEach(el => el.onclick = () => { if (S.items.length < 8) S.items.push(el.dataset.take); done(); });
  const c = document.getElementById("catch"); if (c) c.onclick = () => { S.team.push(mkMon(B.foes[0].sp, B.Z.lvl)); done(); };
  app.querySelectorAll(".teambar .card.click").forEach(el => el.onclick = () => { const i = +el.dataset.i; if (!confirm(`Release ${SP[S.team[i].sp].name} for ${lead.name}?`)) return; S.team[i] = mkMon(B.foes[0].sp, B.Z.lvl); S.active = 0; done(); });
  const ct = document.getElementById("cont"); if (ct) { ct.onclick = done; ct.focus(); }
}
function startLap() {
  S.zones[S.zi].done++;
  B = { solo: true, lap: true, answered: false, elim: [], msg: "" };
  if (!soloDraw(true)) { B = null; S.zi++; return S.zi >= S.zones.length ? results() : mapScreen(); }
  battleScreen();
}
function advance() {
  const Z = S.zones[S.zi], wasBoss = B.boss;
  B = null; Z.done++; if (!wasBoss) Z.wi++;
  if (wasBoss || (S.mode === "test" && zRemaining(Z) === 0)) S.zi++;
  if (S.zi >= S.zones.length) return results();
  if (S.active >= S.team.length) S.active = 0;
  mapScreen();
}

/* ---------- results + sharing ---------- */
function computeScore() {
  const L = S.log;
  if (S.mode === "quiz") { const right = L.filter(x => x.ok).length; return { right, total: L.length, pct: L.length ? Math.round(right / L.length * 100) : 0, label: `${right}/${L.length} correct` }; }
  const mc = L.filter(x => x.kind === "mc"), tf = L.filter(x => x.kind === "tf"), sa = L.filter(x => x.kind === "sa");
  const pts = mc.filter(x => x.ok).length + tf.filter(x => x.ok).length + sa.reduce((s, x) => s + x.sa / 2, 0);
  return { pts, pct: Math.round(pts / 48 * 100), mc: mc.filter(x => x.ok).length, tf: tf.filter(x => x.ok).length, sa: sa.map(x => x.sa), label: `${pts}/48 pts` };
}
function letter(p) { return p >= 90 ? "A" : p >= 80 ? "B" : p >= 70 ? "C" : p >= 60 ? "D" : "F"; }
function shareText(sc) {
  const code = `${S.mode === "quiz" ? "Q" : "T"}-${S.seed}-${sc.pct}-${encodeURIComponent(S.name).slice(0, 30)}`;
  const rows = [0, 1, 2].map(z => { const L = S.log.filter(x => x.z === z); if (!L.length) return null; return `Z${z + 1} ` + L.map(x => x.kind === "sa" ? ` ✍️${x.sa}` : x.ok ? "⬛" : "⬜").join(""); }).filter(Boolean);
  const team = S.team.length ? S.team.map(m => `${SP[m.sp].name} ${TYPES[SP[m.sp].c].icon}Lv${m.lvl}`).join(" · ") : "nobody left standing";
  const url = (SHARE_URL || store.get("url", "") || (/^https?:/.test(location.protocol) ? location.origin + location.pathname : "")).trim();
  return [
    `COMPÉMON ⚔ Comp Exam 2 · ${S.mode.toUpperCase()} run`,
    S.mode === "quiz" ? `${sc.label} (${sc.pct}%) · ${S.over ? "wiped out in Zone " + (S.zi + 1) : "cleared!"}` : `${sc.label} · ${sc.pct}% (${letter(sc.pct)})`,
    `Badges ${"🏅".repeat(S.badges)}${"▫️".repeat(3 - S.badges)} · KOs ${S.kos}`,
    ...rows,
    `Team: ${team}`,
    S.fallen.length ? `🪦 ${S.fallen.map(f => SP[f.sp].name).join(", ")}` : "",
    `Beat me → code ${code}`,
    url ? `${url}#c=${code}` : ""
  ].filter(Boolean).join("\n");
}
function results() {
  B = null;
  const sc = computeScore();
  const entry = { at: new Date().toISOString(), mode: S.mode, seed: S.seed, name: S.name, pct: sc.pct, label: sc.label, badges: S.badges, over: S.over, kos: S.kos,
    team: S.team.map(m => ({ sp: m.sp, lvl: m.lvl })), fallen: S.fallen.slice(), items: S.items.slice() };
  if (!S.saved) { const runs = store.get("runs", []); runs.unshift(entry); store.set("runs", runs.slice(0, 50)); S.saved = 1; }
  const txt = shareText(sc);
  const missed = S.log.filter(x => !x.ok && !(x.kind === "sa" && x.sa >= 9));
  const vs = CH && CH.seed === S.seed ? `<div class="banner"><b>Challenge result:</b> you ${sc.pct > CH.pct ? "WON 🏆" : sc.pct === CH.pct ? "TIED 🤝" : "lost 💀"} — ${sc.pct}% vs ${esc(CH.name || "friend")}'s ${CH.pct}%.</div>` : "";
  app.innerHTML = `
  <h1>${S.over ? "Run over" : S.mode === "test" ? "Exam complete 🎓" : "Run cleared!"}</h1>
  ${vs}
  <div class="box">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:42px;font-weight:bold">${sc.pct}%${S.mode === "test" ? " · " + letter(sc.pct) : ""}</div>
      <div>${sc.label}${S.mode === "test" ? ` · MC ${sc.mc}/29 · T/F ${sc.tf}/9 · Short answers ${sc.sa.map(s => s + "/10").join(", ") || "—"}` : ""}</div>
      <div class="small muted">Badges ${S.badges}/3 · KOs ${S.kos} · Code ${S.mode === "quiz" ? "Q" : "T"}-${S.seed}</div></div>
      ${trainerSVG(90)}
    </div>
    <h3>Final team</h3>${S.team.length ? `<div class="teambar">${S.team.map(m => card(m, {})).join("")}</div>` : "<p class='muted'>Nobody left standing.</p>"}
    ${S.fallen.length ? `<h3 style="margin-top:12px">🪦 Fallen</h3><div class="teambar">${S.fallen.map(f => card({ ...f, hp: 0, max: 1 }, { ko: 1 })).join("")}</div>` : ""}
    <h3 style="margin-top:12px">Items left</h3>${S.items.length ? `<div class="bag">${S.items.map(k => `<span class="item"><span class="emo">${ITEMS[k].i}</span> ${ITEMS[k].n}</span>`).join("")}</div>` : "<p class='muted small'>None.</p>"}
  </div>
  <div class="box" style="margin-top:14px">
    <h3>Share & challenge</h3>
    <div class="share" id="shareTxt">${esc(txt)}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn dark center" id="copy">📋 Copy share text</button>
      ${navigator.share ? `<button class="btn center" id="nshare">Share…</button>` : ""}
      <span id="copied" class="small"></span>
    </div>
    ${SHARE_URL ? "" : `<details style="margin-top:10px"><summary class="small">Add your game link (so friends can tap to play)</summary>
      <p class="small">Host this file once (for example on Netlify Drop), then paste the link here. It is saved for next time.</p>
      <div class="row"><input type="text" id="urlIn" placeholder="https://your-site.netlify.app/" value="${esc(store.get("url", ""))}" style="flex:1;min-width:220px"><button class="btn center" id="urlSave">Save link</button></div></details>`}
  </div>
  <div class="box" style="margin-top:14px">
    <h3>Study review — ${missed.length} to revisit</h3>
    ${missed.length ? missed.map(x => `<div style="border-top:2px dashed #111;padding:8px 0">${typeTag(x.c)} <b>${esc(x.q)}</b><br>${x.kind === "sa" ? `Your score: ${x.sa}/10.` : `You picked: <i>${esc(x.pick)}</i>.`}<br><b>Answer:</b> ${esc(x.right)}<br><span class="small muted">${x.kind === "sa" ? "" : esc(x.e)}</span></div>`).join("") : "<p>Perfect run. Nothing to review!</p>"}
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn center" id="again">↻ Replay same code</button>
    <button class="btn dark center" id="home">New run</button>
    <button class="btn center" id="hof">🏆 Hall of Fame</button>
  </div>`;
  document.getElementById("copy").onclick = () => copyText(document.getElementById("shareTxt").textContent);
  const ns = document.getElementById("nshare"); if (ns) ns.onclick = () => navigator.share({ text: document.getElementById("shareTxt").textContent }).catch(() => {});
  const us = document.getElementById("urlSave"); if (us) us.onclick = () => { store.set("url", document.getElementById("urlIn").value.trim()); results(); };
  document.getElementById("again").onclick = () => { const m = S.mode, s = S.seed; chooseStarter(m, s); };
  document.getElementById("home").onclick = () => { CH = null; history.replaceState(null, "", location.pathname + location.search); title(); };
  document.getElementById("hof").onclick = hallOfFame;
}
function copyText(t) {
  const ok = () => { document.getElementById("copied").textContent = "Copied! Paste it to your friends."; };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let good = false; try { good = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); if (good) ok(); else { const r = document.createRange(); r.selectNodeContents(document.getElementById("shareTxt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById("copied").textContent = "Text selected — press ⌘C to copy."; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
}
function hallOfFame() {
  const runs = store.get("runs", []);
  app.innerHTML = `<h2>🏆 Hall of Fame</h2><p class="muted small">Your runs on this device (newest first). Replay any code to beat your own score.</p>
  <div class="box hof">${runs.length ? runs.map((r, i) => `<div class="entry"><div class="row" style="justify-content:space-between">
    <div><b>${r.pct}%</b> · ${r.mode.toUpperCase()} · ${esc(r.label)} · 🏅${r.badges}${r.kos != null ? " · KOs " + r.kos : ""}${r.over ? " · wiped" : ""}<br><span class="small muted">${new Date(r.at).toLocaleString()} · ${esc(r.name)} · code ${r.mode === "quiz" ? "Q" : "T"}-${r.seed}</span></div>
    <button class="btn center" data-re="${i}">Replay</button></div>
    <div class="minis">${r.team.map(m => `<div>${monSVG(m.sp, 56)}<br>${esc(SP[m.sp].name)} Lv${m.lvl}</div>`).join("")}${(r.fallen || []).map(m => `<div>${monSVG(m.sp, 46, true)}<br>🪦 ${esc(SP[m.sp].name)}</div>`).join("")}</div></div>`).join("") : "<p>No runs yet. Go catch some Compémon!</p>"}</div>
  <div class="row" style="margin-top:12px"><button class="btn" id="back">← Back</button>${runs.length ? '<button class="btn" id="clr">Clear history</button>' : ""}</div>`;
  app.querySelectorAll("[data-re]").forEach(el => el.onclick = () => { const r = runs[+el.dataset.re]; CH = null; chooseStarter(r.mode, r.seed); });
  document.getElementById("back").onclick = title;
  const c = document.getElementById("clr"); if (c) c.onclick = () => { if (confirm("Delete all saved runs?")) { store.set("runs", []); hallOfFame(); } };
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "Enter" && e.target.tagName === "BUTTON") return; // the focused button handles Enter itself
  if (/^[1-4]$/.test(e.key)) { const b = document.querySelector(`[data-o="${+e.key - 1}"]`); if (b && !b.disabled) b.click(); }
  else if (e.key === "Enter") { const n = document.getElementById("next") || document.getElementById("cont"); if (n) n.click(); }
});

/* ---------- boot ---------- */
function readHash() { const m = /c=([^&]+)/.exec(location.hash); CH = m ? parseCode(decodeURIComponent(m[1])) : null; if (CH && CH.pct == null) CH = null; }
window.addEventListener("hashchange", () => { readHash(); if (!S) title(); });
readHash();
title();
</script>
</body>
</html>
